[platformio]
default_envs = uno_r4_wifi

[env:uno_r4_wifi]
platform = renesas-ra@1.9.0
board = uno_r4_wifi
framework = arduino
monitor_speed = 9600
lib_ldf_mode = deep+
lib_deps =
    https://github.com/umdenes100/ENES100ArduinoLibrary/archive/refs/tags/v6.2.4.zip
    arduino-libraries/ArduinoHttpClient@0.6.2

